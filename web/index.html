<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CedarLogic</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>CedarLogic</h1>
        <div class="actions">
          <button id="open" type="button">Open…</button>
          <button id="save" type="button">Save</button>
          <button id="clear" type="button">New</button>
        </div>
        <div class="actions sim">
          <button id="run" type="button" title="Run or pause the simulation">Pause</button>
          <button id="step" type="button" title="Advance one time step">Step</button>
        </div>
        <div class="spacer"></div>
        <div id="readout" aria-live="polite"></div>
      </header>

      <aside id="palette">
        <label class="search">
          <input id="filter" type="search" placeholder="Filter gates" autocomplete="off" />
        </label>
        <ul id="gates"></ul>
      </aside>

      <main>
        <canvas id="canvas" tabindex="0"></canvas>
        <div id="hint">wheel zooms · space fits · drag with middle or space</div>
      </main>

      <div id="status" role="status"></div>
    </div>
    <input id="file" type="file" accept=".cdl" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

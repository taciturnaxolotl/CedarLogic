name: Release Build

# Releases are cut by pushing a tag (`task release` does the bump, tag, and
# push). Everything after that -- builds, changelog, GitHub release, appcast,
# npm -- happens here.
on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build (e.g., v2.3.8); leave empty for a dry run'
        required: false
      signing_profile:
        description: 'Authenticode profile. The test profile signs against a root Windows does not trust, so dry runs cannot ship a real signature.'
        required: false
        type: choice
        default: cedarlogic-test
        options:
          - cedarlogic-test
          - cedarlogic-public

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The tag being released. On a tag push that is the ref itself.
  VERSION: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'dev' }}
  # Tag pushes are real releases and always get the real certificate.
  SIGNING_PROFILE: ${{ github.event.inputs.signing_profile || 'cedarlogic-public' }}

jobs:
  # Build (or cache-restore) the Skia dist as part of this run, so every desktop
  # job downloads it from here rather than from a previous run's artifact, which
  # can expire or be missing.
  skia:
    uses: ./.github/workflows/skia.yml

  build-windows:
    needs: skia
    runs-on: windows-latest
    # Entra's federated credential matches environment:release and nothing else.
    environment: release
    permissions:
      id-token: write   # mint the OIDC token the Azure login exchanges
      contents: read
    outputs:
      exe_size: ${{ steps.measure.outputs.exe_size }}
      winsparkle_signature: ${{ steps.sign.outputs.signature }}
    steps:
      - uses: actions/checkout@v7

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION="${{ env.VERSION }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Install NSIS
        shell: pwsh
        run: |
          # The Chocolatey feed 503s now and then, and choco still exits 0 after
          # installing nothing. The run then spends nine minutes compiling before
          # cpack is the one to find out. Ride out the blip, and make a missing
          # compiler this step's problem rather than Package's.
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          foreach ($attempt in 1..3) {
            choco install nsis -y --no-progress
            if (Test-Path $makensis) { break }
            Write-Host "::warning::NSIS missing after attempt $attempt; retrying"
            if ($attempt -lt 3) { Start-Sleep -Seconds (20 * $attempt) }
          }
          if (-not (Test-Path $makensis)) { throw "NSIS did not install: $makensis is missing" }

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: windows-msvc
          variant: sccache

      - name: Cache wxWidgets
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: wxwidgets-windows-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            wxwidgets-windows-

      - name: Ensure build/_deps exists
        shell: bash
        run: mkdir -p build/_deps

      # Skia is the renderer the app actually uses; without it the build falls
      # back to the legacy fixed-function GL path. The dist is x86 to match this
      # 32-bit build (see cmake/skia-args/windows.gn).
      - name: Download Skia dist
        uses: actions/download-artifact@v8
        with:
          name: skia-windows
          path: skia-dist

      - name: Configure CMake
        shell: bash
        env:
          SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
        run: |
          cmake -B build -A Win32 \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DUSE_SYSTEM_SKIA=OFF -DSKIA_ROOT="$PWD/skia-dist" \
            -DSPARKLE_ED_PUBLIC_KEY="$SPARKLE_ED_PUBLIC_KEY" \
            -DCPACK_PACKAGE_VERSION="${{ steps.version.outputs.version }}"

      - name: Build
        run: cmake --build build --config Release

      # Launch the built exe once before shipping it. --render-gate builds the
      # main window, which parses the embedded gate library, then renders one
      # gate and exits non-zero on failure. This is the exact path that crashed
      # on startup in 3.1.0/3.1.1 (issue #103): CI built the Windows exe but
      # never ran it, so a library that failed to parse shipped to everyone.
      # It has to run here, on a Windows checkout, because that is where the
      # line endings that triggered it come from.
      - name: Smoke test (launch and render a gate)
        id: smoke
        shell: bash
        run: |
          EXE=$(find build -name CedarLogic.exe -path '*Release*' | head -1)
          if [ -z "$EXE" ]; then echo "::error::no CedarLogic.exe under build/"; exit 1; fi
          echo "Smoke testing $EXE"
          "$EXE" --render-gate AA_AND2 0 smoke.png
          if [ ! -s smoke.png ]; then
            echo "::error::--render-gate produced no output; the exe likely crashed at startup"
            exit 1
          fi
          echo "Smoke test passed: gate library parsed and rendered."
          # Sign this one binary, not every .exe under build/, and hand over a
          # Windows path since the signing action is PowerShell.
          EXE_DIR=$(cd "$(dirname "$EXE")" && pwd -W)
          echo "exe=$EXE_DIR/CedarLogic.exe" >> $GITHUB_OUTPUT

      # Smart App Control blocks unsigned executables outright, no "run anyway" (#123).
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Before cpack, so the installer packages a signed binary. SAC rechecks the
      # app on every launch, not just at download.
      - name: Sign CedarLogic.exe (Authenticode)
        uses: Azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: cedarlogicsign
          certificate-profile-name: ${{ env.SIGNING_PROFILE }}
          files: ${{ steps.smoke.outputs.exe }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: CedarLogic
          description-url: https://github.com/taciturnaxolotl/CedarLogic

      - name: Package
        id: package
        shell: bash
        run: |
          cd build
          cpack -G NSIS -C Release
          EXE_PATH=$(ls CedarLogic-*-win32.exe | head -1)
          echo "installer=$(pwd -W)/$EXE_PATH" >> $GITHUB_OUTPUT

      # The installer needs its own signature; SAC inspects it at download time.
      - name: Sign installer (Authenticode)
        uses: Azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: cedarlogicsign
          certificate-profile-name: ${{ env.SIGNING_PROFILE }}
          files: ${{ steps.package.outputs.installer }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: CedarLogic Installer
          description-url: https://github.com/taciturnaxolotl/CedarLogic

      # After signing, never before: Authenticode appends bytes, and this number
      # becomes the appcast length field every updating client trusts.
      - name: Measure installer
        id: measure
        shell: bash
        run: |
          cd build
          EXE_PATH=$(ls CedarLogic-*-win32.exe | head -1)
          EXE_SIZE=$(stat -c%s "$EXE_PATH")
          echo "exe_size=$EXE_SIZE" >> $GITHUB_OUTPUT
          echo "Signed installer is $EXE_SIZE bytes."

      # Sign the installer with the same Ed25519 pair Sparkle uses on macOS; the
      # two tools read the same key format. The exe carries the matching public
      # key as an "EdDSAPub" resource, so WinSparkle verifies the download
      # against this signature before running it. Without the pair the updater
      # installs whatever the feed points at, authenticated by nothing but TLS.
      #
      # Must stay after Authenticode: this signs the file's bytes and Authenticode
      # rewrites them, so signing first breaks auto-update for everyone installed.
      - name: Sign installer (EdDSA)
        id: sign
        shell: bash
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY is not set, so this release would ship updates nobody can verify."
            exit 1
          fi
          if [ -z "$SPARKLE_ED_PUBLIC_KEY" ]; then
            echo "::error::SPARKLE_ED_PUBLIC_KEY is not set, so the exe would carry no key to verify against."
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/winsparkle.key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEY_FILE"

          # winsparkle-tool.exe ships in bin/ of the WinSparkle dist that
          # FetchContent unpacked under build/_deps.
          TOOL=$(find build/_deps -name winsparkle-tool.exe | head -1)
          if [ -z "$TOOL" ]; then echo "::error::winsparkle-tool.exe not found under build/_deps"; exit 1; fi
          TOOL=$(cd "$(dirname "$TOOL")" && pwd)/winsparkle-tool.exe

          cd build
          EXE_PATH=$(ls CedarLogic-*-win32.exe | head -1)
          OUT=$("$TOOL" sign -f "$KEY_FILE" --verbose "$EXE_PATH")
          rm -f "$KEY_FILE"

          SIGNATURE=$(echo "$OUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          if [ -z "$SIGNATURE" ]; then
            echo "::error::winsparkle-tool produced no signature: $OUT"
            exit 1
          fi

          # Prove the signature verifies against the public key the exe embeds, so a
          # key mismatch fails here rather than on every user's machine.
          "$TOOL" verify -p "$SPARKLE_ED_PUBLIC_KEY" -s "$SIGNATURE" "$EXE_PATH"

          echo "signature=$SIGNATURE" >> $GITHUB_OUTPUT

      # Keep the symbols for this exact build. A crash report from the field
      # carries module+offset; without the matching .pdb those offsets can never
      # be turned back into a function and a line, and the build that produced
      # them disappears the moment this runner is recycled. The installer now
      # carries a copy too, so reports from a fresh install symbolize
      # themselves. This zip is what resolves reports from older installs.
      - name: Stage debug symbols
        shell: pwsh
        run: |
          $pdb = Get-ChildItem -Path build -Filter CedarLogic.pdb -Recurse |
                 Sort-Object Length -Descending | Select-Object -First 1
          if (-not $pdb) { throw "No CedarLogic.pdb was produced; crash reports would stay unreadable." }
          $ver = "${{ steps.version.outputs.version }}"
          Write-Host "PDB: $($pdb.FullName) ($([math]::Round($pdb.Length/1MB,1)) MB)"
          Compress-Archive -Path $pdb.FullName -DestinationPath "build/CedarLogic-$ver-win32.pdb.zip" -Force

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            build/CedarLogic-*-win32.exe
            build/CedarLogic-*-win32.pdb.zip

  build-linux:
    needs: skia
    # matches skia build and allows running on older glibc versions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Get version
        id: version
        run: |
          VERSION="${{ env.VERSION }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgtk-3-dev libglu1-mesa-dev ccache \
            libgl1-mesa-dev libfontconfig1-dev

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux-gcc

      - name: Cache wxWidgets
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: wxwidgets-linux-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            wxwidgets-linux-

      - name: Download Skia dist
        uses: actions/download-artifact@v8
        with:
          name: skia-linux
          path: skia-dist

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DUSE_SYSTEM_WXWIDGETS=0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DUSE_SYSTEM_SKIA=OFF -DSKIA_ROOT="$PWD/skia-dist" \
            -DCPACK_PACKAGE_VERSION="${{ steps.version.outputs.version }}"

      - name: Build
        run: cmake --build build -j$(nproc)

      # The DWARF split out of the binary at link time. The shipped executable
      # keeps only a build ID pointing at this file, so without it a Linux crash
      # report can name a function and nothing more.
      - name: Stage debug symbols
        run: |
          DEBUG=$(find build -maxdepth 2 -name 'CedarLogic.debug' | head -1)
          if [ -z "$DEBUG" ]; then
            echo "No CedarLogic.debug was produced; crash reports would stay unreadable." >&2
            exit 1
          fi
          VER="${{ steps.version.outputs.version }}"
          gzip -9 -c "$DEBUG" > "build/CedarLogic-$VER-Linux.debug.gz"
          ls -lh "$DEBUG" "build/CedarLogic-$VER-Linux.debug.gz"

      - name: Package
        run: |
          cd build
          cpack -G TGZ

      - name: Upload Linux Archive
        uses: actions/upload-artifact@v7
        with:
          name: linux-archive
          path: |
            build/CedarLogic-*-Linux.tar.gz
            build/CedarLogic-*-Linux.debug.gz

  build-macos:
    needs: skia
    runs-on: macos-26
    outputs:
      dmg_name: ${{ steps.package.outputs.dmg_name }}
      dmg_size: ${{ steps.sparkle_sign.outputs.dmg_size }}
      sparkle_signature: ${{ steps.sparkle_sign.outputs.signature }}
    steps:
      - uses: actions/checkout@v7

      - name: Get version
        id: version
        run: |
          VERSION="${{ env.VERSION }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Import Code Signing Certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: macos-clang

      - name: Cache wxWidgets
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: wxwidgets-macos-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            wxwidgets-macos-

      - name: Download Skia dist
        uses: actions/download-artifact@v8
        with:
          name: skia-macos
          path: skia-dist

      - name: Configure CMake
        env:
          SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DUSE_SYSTEM_SKIA=OFF -DSKIA_ROOT="$PWD/skia-dist" \
            -DCPACK_PACKAGE_VERSION="${{ steps.version.outputs.version }}" \
            -DSPARKLE_ED_PUBLIC_KEY="$SPARKLE_ED_PUBLIC_KEY"

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      # dsymutil gathered this at link time from the .o files, which die with
      # this runner -- so it is the only copy that will ever exist. Staged
      # before signing deliberately: codesign leaves the Mach-O UUID alone, and
      # the UUID is what matches this bundle to the binary users install.
      - name: Stage debug symbols
        run: |
          DSYM=$(find build -maxdepth 2 -name 'CedarLogic.app.dSYM' | head -1)
          if [ -z "$DSYM" ]; then
            echo "No CedarLogic.app.dSYM was produced; crash reports would stay unreadable." >&2
            exit 1
          fi
          VER="${{ steps.version.outputs.version }}"
          dwarfdump --uuid "$DSYM" || true
          ditto -c -k --sequesterRsrc --keepParent \
            "$DSYM" "build/CedarLogic-$VER-Darwin.dSYM.zip"
          ls -lh "build/CedarLogic-$VER-Darwin.dSYM.zip"

      - name: Install and Sign Application
        id: package
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          SIGN_ID="Developer ID Application: Single Feather LLC ($APPLE_TEAM_ID)"

          # Install to staging directory (runs install_name_tool fixups)
          cmake --install build --prefix build/staging

          # Find the .app in staging
          APP_PATH=$(find build/staging -name "*.app" -type d | head -1)
          echo "Signing $APP_PATH"

          # Sign Sparkle framework inside-out
          # See: https://steipete.me/posts/2025/code-signing-and-notarization-sparkle-and-tears
          SPARKLE_PATH="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          if [ -d "$SPARKLE_PATH" ]; then
            codesign -f -s "$SIGN_ID" -o runtime --timestamp \
              "$SPARKLE_PATH/Versions/B/XPCServices/Installer.xpc"
            codesign -f -s "$SIGN_ID" -o runtime --timestamp --preserve-metadata=entitlements \
              "$SPARKLE_PATH/Versions/B/XPCServices/Downloader.xpc"
            codesign -f -s "$SIGN_ID" -o runtime --timestamp \
              "$SPARKLE_PATH/Versions/B/Updater.app"
            codesign -f -s "$SIGN_ID" -o runtime --timestamp \
              "$SPARKLE_PATH/Versions/B/Autoupdate"
            codesign -f -s "$SIGN_ID" -o runtime --timestamp \
              "$SPARKLE_PATH"
          fi

          # Sign the main app (never use --deep)
          codesign -f -s "$SIGN_ID" -o runtime --timestamp "$APP_PATH"
          codesign -dv --verbose=2 "$APP_PATH"

          # Create DMG from signed app with Applications symlink
          DMG_NAME="CedarLogic-${{ steps.version.outputs.version }}-Darwin.dmg"
          DMG_STAGING=$(mktemp -d)
          cp -a "$APP_PATH" "$DMG_STAGING/"
          ln -s /Applications "$DMG_STAGING/Applications"
          hdiutil create -volname "CedarLogic" -srcfolder "$DMG_STAGING" -ov -format UDZO "build/$DMG_NAME"
          rm -rf "$DMG_STAGING"
          echo "dmg_name=$DMG_NAME" >> $GITHUB_OUTPUT

      - name: Sign DMG
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH=$(find build -name "*.dmg" -type f | head -1)
          echo "Signing $DMG_PATH"

          codesign --force --sign "Developer ID Application: Single Feather LLC ($APPLE_TEAM_ID)" \
            --timestamp \
            "$DMG_PATH"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH=$(find build -name "*.dmg" -type f | head -1)
          echo "Notarizing $DMG_PATH"

          # Submit for notarization
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json | tee notarization_result.json

          # Log details if notarization failed
          SUBMISSION_ID=$(cat notarization_result.json | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])" 2>/dev/null || true)
          if [ -n "$SUBMISSION_ID" ]; then
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
          fi

          # Staple the ticket
          xcrun stapler staple "$DMG_PATH"

          echo "Notarization complete!"

      - name: Sign for Sparkle
        id: sparkle_sign
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          DMG_PATH=$(find build -name "*.dmg" -type f | head -1)

          # Get DMG size
          DMG_SIZE=$(stat -f%z "$DMG_PATH")
          echo "dmg_size=$DMG_SIZE" >> $GITHUB_OUTPUT

          # Download Sparkle tools
          SPARKLE_VERSION="2.6.4"
          curl -L "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" | tar -xJ

          # Sign with EdDSA key (sign_update outputs: sparkle:edSignature="XXX" length="YYY")
          SIGN_OUTPUT=$(echo -n "$SPARKLE_ED_PRIVATE_KEY" | ./bin/sign_update "$DMG_PATH" -f -)
          SIGNATURE=$(echo "$SIGN_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          echo "signature=$SIGNATURE" >> $GITHUB_OUTPUT

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: |
            build/CedarLogic-*-Darwin.dmg
            build/CedarLogic-*-Darwin.dSYM.zip

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get version
        id: version
        run: |
          VERSION="${{ env.VERSION }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: wasm-emscripten

      - name: Build WASM
        run: |
          cd wasm
          mkdir -p build
          cd build
          emcmake cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          emmake make -j$(nproc)

      - name: Package WASM
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p wasm-dist
          cp wasm/build/cedarlogic.js wasm-dist/
          cp wasm/build/cedarlogic.wasm wasm-dist/
          cp wasm/cedarlogic.d.ts wasm-dist/
          cp wasm/README.md wasm-dist/
          # Stamp version into package.json
          sed "s/\"version\": \"0.0.1\"/\"version\": \"${VERSION}\"/" wasm/package.json > wasm-dist/package.json
          cd wasm-dist
          tar -czf ../CedarLogic-${VERSION}-wasm.tar.gz .

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-bundle
          path: CedarLogic-*-wasm.tar.gz

  upload-release:
    needs: [build-windows, build-linux, build-macos, build-wasm]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
      id-token: write
    steps:
      # RELEASE_TOKEN is an admin-owned PAT. The default GITHUB_TOKEN cannot
      # push the appcast commit: master's ruleset requires signatures and
      # passing status checks, and only repository admins bypass it.
      - uses: actions/checkout@v7
        with:
          ref: master
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Get version
        id: version
        run: |
          VERSION="${{ env.VERSION }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Checksums
        run: |
          mkdir -p dist
          cp artifacts/windows-installer/* artifacts/linux-archive/* \
             artifacts/macos-dmg/* artifacts/wasm-bundle/* dist/
          cd dist && sha256sum * > checksums.txt

      # The announcement lives in the draft release for this tag (see
      # `task notes`). Everything above the footer marker is hand-written and
      # kept; the footer below it is regenerated, so re-running the workflow on
      # a tag is idempotent.
      - name: Assemble release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.VERSION }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view "$TAG" --json body -q .body > existing.md 2>/dev/null || true
          awk '/^<!-- footer -->$/ { exit } { print }' existing.md > prose.md

          {
            cat prose.md
            sed -e "s|__TAG__|$TAG|g" -e "s|__VERSION__|$RELEASE_VERSION|g" \
              .github/release-footer.md
          } > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body_path: release-notes.md
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: dist/*

      # Sparkle's "what's new" pane gets the announcement, but not the download
      # table and checksum instructions.
      - name: Update Sparkle appcast
        run: |
          RELEASE_BODY="$(cat prose.md)"
          ./scripts/update-appcast.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ env.VERSION }}" \
            "${{ needs.build-macos.outputs.dmg_size }}" \
            "${{ needs.build-windows.outputs.exe_size }}" \
            "${{ needs.build-macos.outputs.sparkle_signature }}" \
            "${{ needs.build-windows.outputs.winsparkle_signature }}" \
            "$RELEASE_BODY" \
            "${{ github.repository }}"

      - name: Commit and push appcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          git commit -m "chore(release): update appcast for ${{ env.VERSION }}" || exit 0
          git push

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish npm package
        run: |
          mkdir -p npm-publish
          tar -xzf artifacts/wasm-bundle/CedarLogic-*-wasm.tar.gz -C npm-publish
          cd npm-publish
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          # Skip publish if this version already exists on npm
          if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null; then
            echo "Version ${PKG_VERSION} already published to npm, skipping."
          else
            npm publish --access public
          fi

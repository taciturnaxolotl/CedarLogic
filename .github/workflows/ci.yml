name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, wxWidgets-free unit tests for both logic cores, instrumented with
  # AddressSanitizer + UBSan so memory bugs fail the build.
  unit-tests:
    name: Unit tests (ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build

      - name: logic/ suite
        run: |
          cmake -S logic -B build/logic -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON
          cmake --build build/logic
          ctest --test-dir build/logic --output-on-failure

      - name: format/ suite
        run: |
          cmake -S format -B build/format -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON
          cmake --build build/format
          ctest --test-dir build/format --output-on-failure

  # Coverage of the shipping logic engine, from the wx-free suite.
  coverage:
    name: Coverage (logic engine)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build gcovr

      - name: Build logic tests with coverage
        run: |
          cmake -S logic -B build/logic -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON
          cmake --build build/logic

      - name: Run tests
        run: ctest --test-dir build/logic --output-on-failure

      - name: Generate coverage report
        run: |
          gcovr --root . --filter 'logic/src/' --print-summary \
            --xml-pretty -o coverage.xml --html-details coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage*.html

  # Full application build with the system wxWidgets, plus aggregated ctest, to
  # catch integration/compile regressions in the desktop app.
  # Skia is required to build the app, so produce (or cache-restore) the dist in
  # this run and hand it to the build below. Skipped entirely on a cache hit --
  # only the dist upload always runs.
  skia:
    uses: ./.github/workflows/skia.yml

  build-linux:
    name: Full Linux build + ctest
    needs: skia
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libwxgtk3.2-dev libgtk-3-dev libglu1-mesa-dev ccache \
            libgl1-mesa-dev libfontconfig1-dev

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ci-linux-gcc

      - name: Download Skia dist
        uses: actions/download-artifact@v8
        with:
          name: skia-linux
          path: skia-dist

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DWITH_SKIA=ON -DUSE_SYSTEM_SKIA=OFF
          -DSKIA_ROOT=${{ github.workspace }}/skia-dist
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Build the WebAssembly engine and run the behavioral gate truth-table harness
  # against the real shipping logic core.
  wasm:
    name: WASM engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build WASM
        run: |
          cd wasm
          emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Run behavioral gate tests
        run: |
          cd wasm
          node test_all_gates.mjs

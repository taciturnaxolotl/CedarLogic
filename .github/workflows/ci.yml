name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, wxWidgets-free unit tests for both logic cores, instrumented with
  # AddressSanitizer + UBSan so memory bugs fail the build.
  unit-tests:
    name: Unit tests (ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build

      - name: logic/ suite
        run: |
          cmake -S logic -B build/logic -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON
          cmake --build build/logic
          ctest --test-dir build/logic --output-on-failure

      - name: format/ suite
        run: |
          cmake -S format -B build/format -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON
          cmake --build build/format
          ctest --test-dir build/format --output-on-failure

  # Coverage of the shipping logic engine, from the wx-free suite.
  coverage:
    name: Coverage (logic engine)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build gcovr

      - name: Build logic tests with coverage
        run: |
          cmake -S logic -B build/logic -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON
          cmake --build build/logic

      - name: Run tests
        run: ctest --test-dir build/logic --output-on-failure

      - name: Generate coverage report
        run: |
          gcovr --root . --filter 'logic/src/' --print-summary \
            --xml-pretty -o coverage.xml --html-details coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage*.html

  # Full application build with the system wxWidgets, plus aggregated ctest, to
  # catch integration/compile regressions in the desktop app.
  # Skia is required to build the app, so produce (or cache-restore) the dist in
  # this run and hand it to the build below. Skipped entirely on a cache hit --
  # only the dist upload always runs.
  skia:
    uses: ./.github/workflows/skia.yml

  build-linux:
    name: Full Linux build + ctest
    needs: skia
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libwxgtk3.2-dev libgtk-3-dev libglu1-mesa-dev ccache \
            libgl1-mesa-dev libfontconfig1-dev libcurl4-openssl-dev

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ci-linux-gcc

      - name: Download Skia dist
        uses: actions/download-artifact@v8
        with:
          name: skia-linux
          path: skia-dist

      # The fake reporting address is deliberate. Crash reporting compiles out
      # entirely when none is set, so without one here CI would never build that
      # code and a mistake in it would first appear during a release. It reports
      # nowhere: the address is the documented example, not this project's.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DUSE_SYSTEM_SKIA=OFF
          -DSKIA_ROOT=${{ github.workspace }}/skia-dist
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DSENTRY_DSN=https://examplePublicKey@o0.ingest.sentry.io/0

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Windows is the only build that sees MSVC, <windows.h> and the 32-bit target,
  # so it is the only one that can catch what those bring. It used to run at tag
  # time only, in release.yml, which meant a Windows-only compile error was
  # invisible until after the release tag had been published: v3.2.0 was tagged
  # and then failed to build over a `std::max(` that <windows.h> turns into
  # `std::(`. Packaging, signing and NSIS stay in release.yml; this job only has
  # to answer "does it compile and start".
  build-windows:
    name: Full Windows build + smoke test
    needs: skia
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup sccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ci-windows-msvc
          variant: sccache

      - name: Cache wxWidgets
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: wxwidgets-windows-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            wxwidgets-windows-

      - name: Ensure build/_deps exists
        shell: bash
        run: mkdir -p build/_deps

      # x86 to match the 32-bit app (see cmake/skia-args/windows.gn).
      - name: Download Skia dist
        uses: actions/download-artifact@v8
        with:
          name: skia-windows
          path: skia-dist

      # No SPARKLE_ED_PUBLIC_KEY on purpose. It only embeds the update-signing
      # key, which nothing here installs updates with, and leaving it out keeps
      # this job working on pull requests from forks, which get no secrets.
      - name: Configure
        shell: bash
        run: >
          cmake -B build -A Win32
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DUSE_SYSTEM_SKIA=OFF
          -DSKIA_ROOT="$PWD/skia-dist"

      - name: Build
        run: cmake --build build --config Release

      # Same check release.yml runs before shipping: --render-gate builds the
      # main window, parses the embedded gate library, renders one gate and
      # exits non-zero if any of that fails. A build that compiles but cannot
      # start is what shipped as 3.1.0 (issue #103).
      - name: Smoke test (launch and render a gate)
        shell: bash
        run: |
          EXE=$(find build -name CedarLogic.exe -path '*Release*' | head -1)
          if [ -z "$EXE" ]; then echo "::error::no CedarLogic.exe under build/"; exit 1; fi
          echo "Smoke testing $EXE"
          "$EXE" --render-gate AA_AND2 0 smoke.png
          if [ ! -s smoke.png ]; then
            echo "::error::--render-gate produced no output; the exe likely crashed at startup"
            exit 1
          fi
          echo "Smoke test passed: gate library parsed and rendered."

  # Build the WebAssembly engine and run the behavioral gate truth-table harness
  # against the real shipping logic core.
  wasm:
    name: WASM engine tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build WASM
        run: |
          cd wasm
          emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Run behavioral gate tests
        run: |
          cd wasm
          node test_all_gates.mjs
